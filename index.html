<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- PAGE TITLE: Update with your business name and tagline -->
    <title>Mirdamadi Design | Interior Design Studio</title>
    <!-- META DESCRIPTION: Add your SEO description here -->
    <meta name="description" content="<!-- YOUR META DESCRIPTION HERE -->">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- ========================================
         HEADER / NAVIGATION
         This appears on ALL pages - copy to other HTML files
         ======================================== -->
    <header class="header">
        <div class="container">
            <!-- LOGO TEXT: Your brand name -->
            <a href="index.html" class="logo">MIRDAMADI DESIGN</a>
            
            <!-- Mobile Navigation Toggle -->
            <div class="nav-toggle" onclick="toggleNav()">
                <span></span>
                <span></span>
                <span></span>
            </div>
            
            <nav>
                <ul class="nav-list" id="navList">
                    <li><a href="index.html" class="nav-link active">Home</a></li>
                    <li><a href="portfolio.html" class="nav-link">Portfolio</a></li>
                    <li><a href="about.html" class="nav-link">About</a></li>
                    <li><a href="services.html" class="nav-link">Services</a></li>
                    <li><a href="contact.html" class="nav-link">Contact</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- ========================================
         MAIN CONTENT
         ======================================== -->
    <main>

        <!-- ================================
             HERO SECTION
             Full-width banner with overlay text
             ================================ -->
        <section class="hero">
            <!-- Placeholder for hero background image -->
            <div class="hero-placeholder">Hero Banner Image</div>
            
            <div class="hero-content">
                <!-- HERO HEADLINE: Your main headline/tagline -->
                <h1><!-- YOUR MAIN HEADLINE HERE --></h1>
                
                <!-- HERO SUBHEADLINE: Supporting text for the headline -->
                <p><!-- YOUR SUBHEADLINE/TAGLINE HERE --></p>
            </div>
        </section>

        <!-- ================================
             INTRO / WELCOME SECTION
             ================================ -->
        <section class="section intro">
            <div class="container">
                <!-- SECTION TITLE: Welcome message title (optional) -->
                <h2 class="section-title"><!-- WELCOME SECTION TITLE --></h2>
                
                <div class="intro-text">
                    <!-- WELCOME MESSAGE: Your introduction paragraph(s) -->
                    <p><!-- YOUR WELCOME/INTRO MESSAGE HERE --></p>
                    
                    <!-- ADDITIONAL PARAGRAPHS: Add more <p> tags as needed -->
                    <p><!-- ADDITIONAL INTRO TEXT IF NEEDED --></p>
                </div>
            </div>
        </section>

        <!-- ================================
             FEATURED WORK SECTION
             3-column grid of project thumbnails
             ================================ -->
        <section class="section featured-work">
            <div class="container">
                <!-- SECTION TITLE: e.g., "Featured Projects" or "Recent Work" -->
                <h2 class="section-title"><!-- FEATURED WORK SECTION TITLE --></h2>
                
                <div class="featured-grid">
                    
                    <!-- FEATURED PROJECT 1 -->
                    <article class="featured-item">
                        <div class="placeholder-img">Project 1 Thumbnail</div>
                        <!-- PROJECT 1 TITLE -->
                        <h3><!-- PROJECT 1 NAME --></h3>
                        <!-- PROJECT 1 CATEGORY/DESCRIPTION -->
                        <p><!-- PROJECT 1 CATEGORY OR SHORT DESCRIPTION --></p>
                    </article>
                    
                    <!-- FEATURED PROJECT 2 -->
                    <article class="featured-item">
                        <div class="placeholder-img">Project 2 Thumbnail</div>
                        <!-- PROJECT 2 TITLE -->
                        <h3><!-- PROJECT 2 NAME --></h3>
                        <!-- PROJECT 2 CATEGORY/DESCRIPTION -->
                        <p><!-- PROJECT 2 CATEGORY OR SHORT DESCRIPTION --></p>
                    </article>
                    
                    <!-- FEATURED PROJECT 3 -->
                    <article class="featured-item">
                        <div class="placeholder-img">Project 3 Thumbnail</div>
                        <!-- PROJECT 3 TITLE -->
                        <h3><!-- PROJECT 3 NAME --></h3>
                        <!-- PROJECT 3 CATEGORY/DESCRIPTION -->
                        <p><!-- PROJECT 3 CATEGORY OR SHORT DESCRIPTION --></p>
                    </article>
                    
                </div>
            </div>
        </section>

    </main>

    <!-- ========================================
         FOOTER
         This appears on ALL pages - copy to other HTML files
         ======================================== -->
    <footer class="footer">
        <div class="container">
            <div class="footer-content">
                <!-- FOOTER LOGO: Your brand name -->
                <div class="footer-logo">MIRDAMADI DESIGN</div>
                
                <!-- SOCIAL MEDIA ICONS: Replace with actual icons/links -->
                <div class="social-icons">
                    <!-- SOCIAL LINK 1: e.g., Instagram -->
                    <a href="#" class="social-icon" aria-label="Instagram">IG</a>
                    <!-- SOCIAL LINK 2: e.g., Pinterest -->
                    <a href="#" class="social-icon" aria-label="Pinterest">PIN</a>
                    <!-- SOCIAL LINK 3: e.g., LinkedIn -->
                    <a href="#" class="social-icon" aria-label="LinkedIn">IN</a>
                    <!-- SOCIAL LINK 4: e.g., Facebook -->
                    <a href="#" class="social-icon" aria-label="Facebook">FB</a>
                </div>
            </div>
            
            <div class="footer-bottom">
                <!-- COPYRIGHT: Update year and business name -->
                <p>&copy; 2024 Mirdamadi Design. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <!-- Mobile Navigation Script -->
    <script>
        function toggleNav() {
            document.getElementById('navList').classList.toggle('active');
        }
    </script>

</body>
</html>
