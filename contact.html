<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Mirdamadi Design</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Navigation -->
    <header>
        <div class="container">
            <nav>
                <a href="index.html" class="logo">Mirdamadi Design</a>
                <div class="nav-links">
                    <a href="index.html">Home</a>
                    <a href="portfolio.html">Portfolio</a>
                    <a href="about.html">About</a>
                    <a href="services.html">Services</a>
                    <a href="contact.html">Contact</a>
                </div>
            </nav>
        </div>
    </header>

    <main>
        <section>
            <div class="container">
                <h1 style="margin-bottom: 40px; text-align: center;">Get in Touch</h1>

                <div class="contact-container">
                    <!-- Left Side: Contact Form -->
                    <div class="contact-form">
                        <form action="#" method="POST">
                            <div class="form-group">
                                <label for="name">Name</label>
                                <input type="text" id="name" name="name" placeholder="Your Name" required>
                            </div>

                            <div class="form-group">
                                <label for="email">Email</label>
                                <input type="email" id="email" name="email" placeholder="Your Email" required>
                            </div>

                            <div class="form-group">
                                <label for="subject">Subject</label>
                                <input type="text" id="subject" name="subject" placeholder="Subject">
                            </div>

                            <div class="form-group">
                                <label for="message">Message</label>
                                <textarea id="message" name="message" placeholder="Your Message" required></textarea>
                            </div>

                            <button type="submit">Send Message</button>
                        </form>
                    </div>

                    <!-- Right Side: Contact Info -->
                    <div class="contact-info">
                        <h3>Contact Information</h3>
                        
                        <p>
                            <strong>Email:</strong><br>
                            <!-- INSERT EMAIL HERE -->
                            <!-- Example: info@mirdamadidesign.com -->
                            <!-- info@example.com -->
                        </p>

                        <p>
                            <strong>Phone:</strong><br>
                            <!-- INSERT PHONE NUMBER HERE -->
                            <!-- Example: +1 (555) 123-4567 -->
                            <!-- (555) 123-4567 -->
                        </p>

                        <p>
                            <strong>Address:</strong><br>
                            <!-- INSERT ADDRESS HERE -->
                            <!-- Example: 123 Design Avenue, Creative City, ST 12345 -->
                        </p>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer>
        <div class="container footer-content">
            <p>&copy; 2024 Mirdamadi Design. All rights reserved.</p>
            <div class="social-links">
                <span class="social-placeholder"></span>
                <span class="social-placeholder"></span>
                <span class="social-placeholder"></span>
            </div>
        </div>
    </footer>

</body>
</html>
